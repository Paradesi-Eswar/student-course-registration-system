<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Student Course Registration System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="public-header">
    <nav class="public-navbar">
      <a href="/" class="brand-logo">
        <span class="brand-icon">🎓</span>
        <span>CourseReg Portal</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/login.html">Login</a></li>
        <li><a href="/register.html" class="active">Register</a></li>
      </ul>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <h1 class="auth-title">Create Student Account</h1>
        <p class="auth-subtitle">Register to enroll in academic courses and view registrations</p>
      </div>

      <!-- Alert Box -->
      <div id="register-alert" class="alert alert-danger" style="display: none;"></div>

      <form id="student-register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-roll">Roll Number <span class="required">*</span></label>
            <input type="text" id="reg-roll" class="form-control" placeholder="e.g. 21CS045" required>
            <span class="form-hint">Must be unique institutional roll no.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-branch">Department / Branch <span class="required">*</span></label>
            <select id="reg-branch" class="form-select" required>
              <option value="">Select Branch...</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics">Electronics & Communication</option>
              <option value="Electrical">Electrical Engineering</option>
              <option value="Mechanical">Mechanical Engineering</option>
              <option value="Civil">Civil Engineering</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="e.g. rahul@college.edu" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register-submit" style="margin-top: 0.5rem;">
          Register Account
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="font-weight: 600;">Log in here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('student-register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('register-alert');
      const submitBtn = document.getElementById('btn-register-submit');

      const name = document.getElementById('reg-name').value.trim();
      const roll_no = document.getElementById('reg-roll').value.trim();
      const branch = document.getElementById('reg-branch').value;
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      alertBox.style.display = 'none';

      if (password !== confirmPassword) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerText = 'Passwords do not match. Please verify both password fields.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating Account...';

      try {
        const response = await API.post('/api/auth/student/register', {
          name,
          roll_no,
          branch,
          email,
          password
        });

        alertBox.className = 'alert alert-success';
        alertBox.innerText = response.message || 'Account registered successfully! Redirecting to login...';
        alertBox.style.display = 'block';
        showToast('Registration successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerText = err.message || 'Registration failed. Please review your input.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Register Account';
      }
    });
  </script>
</body>
</html>
